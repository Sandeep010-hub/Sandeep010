<script>
const img = document.getElementById('src');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let particles = [];
let mouse = { x:-9999, y:-9999 };
let signalMode = false;
const REPEL_R = 55;
const REPEL_STRENGTH = 900;
const SPRING_K = 0.055;
const DAMP = 0.86;

function buildParticles(){
  const iw = img.naturalWidth, ih = img.naturalHeight;

  // display size — fit within a nice viewport, preserve aspect
  const maxH = Math.min(window.innerHeight*0.78, 760);
  const dispH = maxH;
  const dispW = dispH * (iw/ih);
  canvas.width = dispW; canvas.height = dispH;
  canvas.style.width = dispW+'px'; canvas.style.height = dispH+'px';

  // sample the image at a manageable resolution
  const off = document.createElement('canvas');
  const sampleW = Math.round(iw/6);
  const sampleH = Math.round(ih/6);
  off.width = sampleW; off.height = sampleH;
  const octx = off.getContext('2d');
  octx.drawImage(img, 0, 0, sampleW, sampleH);
  const data = octx.getImageData(0,0,sampleW,sampleH).data;

  particles = [];
  const scaleX = dispW/sampleW, scaleY = dispH/sampleH;

  for(let sy=0; sy<sampleH; sy++){
    for(let sx=0; sx<sampleW; sx++){
      const idx = (sy*sampleW+sx)*4;
      const r = data[idx], g = data[idx+1], b = data[idx+2];
      const lum = 0.299*r+0.587*g+0.114*b;
      const homeX = sx*scaleX + scaleX/2;
      const homeY = sy*scaleY + scaleY/2;
      const radius = 0.35 + ((255-lum)/255) * 2.3;

      // start scattered off-canvas for a fly-in assembly effect
      const ang = Math.random()*Math.PI*2;
      const dist = 400 + Math.random()*500;
      particles.push({
        hx: homeX, hy: homeY,
        x: homeX + Math.cos(ang)*dist,
        y: homeY + Math.sin(ang)*dist,
        vx:0, vy:0,
        r: radius,
        pr: r, pg: g, pb: b,
        lum: lum
      });
    }
  }
}

function colorFor(p){
  if(!signalMode) return `rgb(${p.pr},${p.pg},${p.pb})`;
  const t = 1 - p.lum/255; // darker => more "signal"
  const cr = Math.round(0 + t*252), cg = Math.round(219 - t*219), cb = Math.round(222 + t*33);
  // blend cyan(0,219,222) -> magenta(252,0,255)
  return `rgb(${cr},${cg},${cb})`;
}

function step(){
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for(const p of particles){
    let ax = (p.hx - p.x) * SPRING_K;
    let ay = (p.hy - p.y) * SPRING_K;

    const dx = p.x - mouse.x, dy = p.y - mouse.y;
    const d2 = dx*dx + dy*dy;
    if(d2 < REPEL_R*REPEL_R){
      const d = Math.sqrt(d2) || 0.01;
      const force = (REPEL_R - d)/REPEL_R * REPEL_STRENGTH / (d*8);
      ax += (dx/d) * force;
      ay += (dy/d) * force;
    }

    p.vx = (p.vx + ax) * DAMP;
    p.vy = (p.vy + ay) * DAMP;
    p.x += p.vx;
    p.y += p.vy;

    ctx.fillStyle = colorFor(p);
    ctx.fillRect(p.x - p.r, p.y - p.r, p.r*2, p.r*2);
  }
  requestAnimationFrame(step);
}

function pos(e){
  const rect = canvas.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  mouse.x = cx - rect.left;
  mouse.y = cy - rect.top;
}
canvas.addEventListener('mousemove', pos);
canvas.addEventListener('mouseleave', ()=>{ mouse.x=-9999; mouse.y=-9999; });
canvas.addEventListener('touchmove', e=>{ pos(e); e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchend', ()=>{ mouse.x=-9999; mouse.y=-9999; });

canvas.addEventListener('click', ()=>{
  for(const p of particles){
    const ang = Math.random()*Math.PI*2;
    const dist = 300 + Math.random()*400;
    p.x = p.hx + Math.cos(ang)*dist;
    p.y = p.hy + Math.sin(ang)*dist;
    p.vx = 0; p.vy = 0;
  }
});
document.getElementById('replayBtn').onclick = ()=> canvas.dispatchEvent(new Event('click'));
document.getElementById('modeBtn').onclick = function(){
  signalMode = !signalMode;
  this.textContent = signalMode ? '◆ PHOTO MODE' : '◆ SIGNAL MODE';
};

if(img.complete){ buildParticles(); step(); }
else img.onload = ()=>{ buildParticles(); step(); };
window.addEventListener('resize', buildParticles);
</script>
